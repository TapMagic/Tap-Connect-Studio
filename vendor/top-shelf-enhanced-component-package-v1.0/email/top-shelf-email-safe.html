  <tr>
    <td style="border-radius:999px;background:#111827;border:1px solid #4b5563;box-shadow:inset 0 1px 0 rgba(255,255,255,.28), inset 0 -2px 3px rgba(0,0,0,.75), 0 8px 18px rgba(0,0,0,.35);">
      <a href="{{URL}}" style="display:inline-block;padding:15px 24px;color:#ffffff;font-family:Arial,sans-serif;font-size:16px;font-weight:700;text-decoration:none;letter-spacing:.02em;">{{LABEL}} &nbsp;→</a>
    </td>
  </tr>
</table>
